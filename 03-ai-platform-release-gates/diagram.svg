" y="698" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="64" y="716" width="4" height="90" rx="2" fill="#2563EB"/><text x="86" y="733" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">EKS release via Argo CD</text><text x="86" y="762" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Approved Git manifest update</text><text x="86" y="785" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Argo CD applies desired state</text><rect x="545" y="698" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="545" y="716" width="4" height="90" rx="2" fill="#2563EB"/><text x="567" y="733" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">AgentCore release</text><text x="567" y="762" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Authorized deployment workflow</text><text x="567" y="785" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Versioned runtime artifact</text><rect x="1026" y="698" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="1026" y="716" width="4" height="90" rx="2" fill="#63748B"/><text x="1048" y="733" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">Release health review</text><text x="1048" y="762" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Error rate + latency signals</text><text x="1048" y="785" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Revert to approved version</text><line x1="64" y1="859" x2="1376" y2="859" stroke="#DDE5EF"/><text x="64" y="894" font-size="18" fill="#334862" font-weight="400" text-anchor="start">A test report supplies evidence. The workflow decides whether the release passes.</text><text x="64" y="923" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">EKS reconciliation and AgentCore deployment use separate release paths.</text><text x="64" y="957" font-size="14" fill="#52627A" font-weight="400" text-anchor="start">Solid arrows: request or deployment flow     Dashed arrows: policy, access or telemetry</text></g></svg>