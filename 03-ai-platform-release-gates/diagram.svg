t-size="16" fill="#52627A" font-weight="400" text-anchor="middle">update Git</text><path d="M 1201.0,582 L 1201,637 L 720,637 L 720.0,698" fill="none" stroke="#405875" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="906.3" y="619" width="167.4" height="24" rx="5" fill="#FBFCFE"/><text x="990" y="637" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">AWS API deployment</text><path d="M 895,761.0 L 1026,761.0" fill="none" stroke="#405875" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="926.6" y="731.0" width="67.80000000000001" height="24" rx="5" fill="#FBFCFE"/><text x="960.5" y="749.0" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">verify</text><rect x="64" y="213" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="64" y="231" width="4" height="90" rx="2" fill="#2563EB"/><text x="86" y="248" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">Reviewed source changes</text><text x="86" y="277" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Application + deployment config</text><text x="86" y="300" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Pinned workflow dependencies</text><rect x="545" y="213" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="545" y="231" width="4" height="90" rx="2" fill="#2563EB"/><text x="567" y="248" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">GitHub Actions validation</text><text x="567" y="277" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">GHAS security checks</text><text x="567" y="300" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">TFLint + Checkov for IaC</text><rect x="1026" y="213" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="1026" y="231" width="4" height="90" rx="2" fill="#7954C8"/><tex