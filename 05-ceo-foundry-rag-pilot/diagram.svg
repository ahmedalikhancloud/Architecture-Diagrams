ont-weight="600" text-anchor="start">AWS security controls</text><text x="567" y="762" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Secrets Manager + IAM</text><text x="567" y="785" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Prisma Cloud + AWS Config</text><rect x="1026" y="698" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="1026" y="716" width="4" height="90" rx="2" fill="#63748B"/><text x="1048" y="733" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">Audit and service logs</text><text x="1048" y="762" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">CloudTrail + CloudWatch</text><text x="1048" y="785" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Access failure investigation</text><line x1="64" y1="859" x2="1376" y2="859" stroke="#DDE5EF"/><text x="64" y="894" font-size="18" fill="#334862" font-weight="400" text-anchor="start">Managed ingestion combines source access, embedding and vector-index updates.</text><text x="64" y="923" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">The platform foundation supports the pilot without operating training infrastructure.</text><text x="64" y="957" font-size="14" fill="#52627A" font-weight="400" text-anchor="start">Solid arrows: request or deployment flow     Dashed arrows: policy, access or telemetry</text></g></svg>