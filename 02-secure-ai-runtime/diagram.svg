<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">Secure AI services on EKS and AgentCore</title><desc id="desc">Separate runtime identities, bounded service access and request-level visibility.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70829A"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1440" height="980" fill="#FBFCFE"/><text x="64" y="44" font-size="15" fill="#087F8C" font-weight="600" text-anchor="start">AHMED ALI KHAN  /  ARCHITECTURE 02</text><text x="64" y="91" font-size="34" fill="#15233D" font-weight="600" text-anchor="start">Secure AI services on EKS and AgentCore</text><text x="64" y="124" font-size="19" fill="#52627A" font-weight="400" text-anchor="start">Separate runtime identities, bounded service access and request-level visibility.</text><text x="1376" y="44" font-size="14" fill="#63748B" font-weight="600" text-anchor="end">FRANKLIN INFOTECH</text><rect x="518" y="156" width="880" height="201" rx="20" fill="#F1F5FA" stroke="#DDE5EF"/><text x="540" y="186" font-size="16" fill="#63748B" font-weight="600" text-anchor="start">APPLICATION AND AGENT RUNTIMES</text><rect x="42" y="399" width="1356" height="204" rx="20" fill="#F1F5FA" stroke="#DDE5EF"/><text x="64" y="429" font-size="16" fill="#63748B" font-weight="600" text-anchor="start">CONTROLLED SERVICE ACCESS</text><path d="M 414,273.0 L 545,273.0" fill="none" stroke="#405875" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="441.45" y="243.0" width="76.10000000000001" height="24" rx="5" fill="#FBFCFE"/><text x="479.5" y="261.0" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">request</text><path d="M 895,273.0 L 1026,273.0" fill="none" stroke="#405875" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="901.7" y="243.0" width="117.60000000000001" height="24" rx="5" fill="#FBFCFE"/><text x="960.5" y="261.0" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">invoke agent</text><path d="M 720.0,336 L 720,396 L 239,396 L 239.0,458" fill="none" stroke="#405875" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="285.35" y="378" width="109.30000000000001" height="24" rx="5" fill="#FBFCFE"/><text x="340" y="396" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">cache check</text><path d="M 720.0,336 L 720.0,458" fill="none" stroke="#405875" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="657.05" y="393" width="125.9" height="24" rx="5" fill="#FBFCFE"/><text x="720" y="411" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">model request</text><path d="M 1201.0,336 L 1201.0,458" fill="none" stroke="#405875" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1154.65" y="393" width="92.7" height="24" rx="5" fill="#FBFCFE"/><text x="1201" y="411" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">tool call</text><path d="M 1201.0,336 L 1201,380 L 990,380 L 990,521 L 895,521.0" fill="none" stroke="#405875" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="951.2" y="362" width="117.60000000000001" height="24" rx="5" fill="#FBFCFE"/><text x="1010" y="380" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">model access</text><path d="M 1201.0,584 L 1201.0,706" fill="none" stroke="#405875" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1121.45" y="634" width="159.10000000000002" height="24" rx="5" fill="#FBFCFE"/><text x="1201" y="652" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">authorized access</text><path d="M 720.0,584 L 720.0,706" fill="none" stroke="#8494AA" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="628.0" y="634" width="184.0" height="24" rx="5" fill="#FBFCFE"/><text x="720" y="652" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">latency and failures</text><path d="M 1201.0,584 L 1201,658 L 990,658 L 990,769 L 895,769.0" fill="none" stroke="#8494AA" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="928.75" y="640" width="142.5" height="24" rx="5" fill="#FBFCFE"/><text x="1000" y="658" font-size="16" fill="#52627A" font-weight="400" text-anchor="middle">tool-call spans</text><rect x="64" y="210" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="64" y="228" width="4" height="90" rx="2" fill="#63748B"/><text x="86" y="245" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">Authenticated application</text><text x="86" y="274" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">User context supplied to service</text><text x="86" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Request and correlation ID</text><rect x="545" y="210" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="545" y="228" width="4" height="90" rx="2" fill="#2563EB"/><text x="567" y="245" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">Amazon EKS services</text><text x="567" y="274" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Autoscaling + health probes</text><text x="567" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Dedicated workload IAM role</text><rect x="1026" y="210" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="1026" y="228" width="4" height="90" rx="2" fill="#2563EB"/><text x="1048" y="245" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">AgentCore Runtime</text><text x="1048" y="274" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Independent execution role</text><text x="1048" y="297" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Allowed agent actions only</text><rect x="64" y="458" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="64" y="476" width="4" height="90" rx="2" fill="#087F8C"/><text x="86" y="493" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">Response cache</text><text x="86" y="522" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Eligible read-only responses</text><text x="86" y="545" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">User scope + TTL + version</text><rect x="545" y="458" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="545" y="476" width="4" height="90" rx="2" fill="#C77716"/><text x="567" y="493" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">Amazon Bedrock</text><text x="567" y="522" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Scoped model invocation</text><text x="567" y="545" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Guardrails where configured</text><rect x="1026" y="458" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="1026" y="476" width="4" height="90" rx="2" fill="#7954C8"/><text x="1048" y="493" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">MCP tool services</text><text x="1048" y="522" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Authenticate the calling identity</text><text x="1048" y="545" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Authorize each tool operation</text><rect x="545" y="706" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="545" y="724" width="4" height="90" rx="2" fill="#63748B"/><text x="567" y="741" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">Operational visibility</text><text x="567" y="770" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">OpenTelemetry request traces</text><text x="567" y="793" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">CloudWatch + Datadog</text><rect x="1026" y="706" width="350" height="126" rx="15" fill="white" stroke="#D3DDEB" stroke-width="1.4"/><rect x="1026" y="724" width="4" height="90" rx="2" fill="#087F8C"/><text x="1048" y="741" font-size="22" fill="#15233D" font-weight="600" text-anchor="start">S3 data access</text><text x="1048" y="770" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Scoped resource permissions</text><text x="1048" y="793" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">KMS encryption + access logs</text><line x1="64" y1="859" x2="1376" y2="859" stroke="#DDE5EF"/><text x="64" y="894" font-size="18" fill="#334862" font-weight="400" text-anchor="start">Each runtime has its own identity. Tool services enforce authorization.</text><text x="64" y="923" font-size="18" fill="#52627A" font-weight="400" text-anchor="start">Private endpoints complement IAM policies; they do not replace them.</text><text x="64" y="957" font-size="14" fill="#52627A" font-weight="400" text-anchor="start">Solid arrows: request or deployment flow     Dashed arrows: policy, access or telemetry</text></g></svg>